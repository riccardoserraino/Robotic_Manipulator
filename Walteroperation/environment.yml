# Ambiente conda per Walteroperation (teleoperazione Estun con MediaPipe)
# Creazione:  conda env create -f environment.yml
# Aggiorna:   conda env update -f environment.yml --prune
name: walteroperation
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - mediapipe==1.2.2   # porta con sé opencv-contrib-python, numpy, matplotlib
